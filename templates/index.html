<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>URL Shortener</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <!-- Bootstrap CSS CDN -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

  <!-- Optional: Custom styles -->
  <style>
    body {
      background-color: #f8f9fa;
    }
    .container {
      max-width: 500px;
      margin-top: 50px;
    }
  </style>
</head>
<body>
  <div class="container bg-white p-4 rounded shadow">
    <h1 class="mb-4 text-center">Simple URL Shortener</h1>
    <form method="POST">
      <div class="mb-3">
        <input type="url" name="url" class="form-control" placeholder="Enter long URL" required>
      </div>
      <button type="submit" class="btn btn-primary w-100">Shorten</button>
    </form>

    {% if short_url %}
    <div class="alert alert-success mt-4 text-center">
      Short URL: <a href="{{ short_url }}" target="_blank">{{ short_url }}</a>
    </div>
    {% endif %}
  </div>

  <!-- Bootstrap JS (optional, for interactivity) -->
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
